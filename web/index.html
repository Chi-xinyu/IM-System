<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #161a23;
            color: #e8edf3;
            padding: 30px;
        }
        h2 {
            margin-bottom: 24px;
            color: #ffffff;
        }
        .card {
            background: #202634;
            border-radius: 14px;
            padding: 24px;
            max-width: 720px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        }
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: #2a3142;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .kick-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            background: #dc3545;
            color: #fff;
            cursor: pointer;
        }
        .tip-empty {
            color: #8892a0;
            padding: 10px;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #4f9aff;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="card">
    <a class="nav-link" href="./chat.html">← 返回聊天室</a>
    <h2>在线用户管理</h2>
    <div id="userList"></div>
</div>

<script>
    const userListDom = document.getElementById("userList");

    function loadOnlineUser() {
        fetch("/api/online")
            .then(r => r.json())
            .then(res => {
                const list = res.data;
                userListDom.innerHTML = "";
                if (list.length === 0) {
                    userListDom.innerHTML = '<div class="tip-empty">暂无在线用户</div>';
                    return;
                }
                list.forEach(u => {
                    const div = document.createElement("div");
                    div.className = "user-item";
                    div.innerHTML = `
                            <div>昵称：${u.name}<br><small style="color:#99a3b2">地址：${u.addr}</small></div>
                            <button class="kick-btn" data-name="${u.name}">踢出</button>
                        `;
                    userListDom.appendChild(div);
                });

                // 绑定踢出事件
                document.querySelectorAll(".kick-btn").forEach(btn => {
                    btn.onclick = async function () {
                        const name = this.dataset.name;
                        if (!confirm(`确认踢出【${name}】？`)) return;
                        const resp = await fetch("/api/kick", {
                            method: "POST",
                            headers: {"Content-Type":"application/json"},
                            body: JSON.stringify({Username: name})
                        });
                        const result = await resp.json();
                        alert(result.msg);
                        loadOnlineUser();
                    }
                })
            })
    }
    loadOnlineUser();
    setInterval(loadOnlineUser, 3000);
    </script>
</body>
</html>
